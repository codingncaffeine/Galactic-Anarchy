# ld65 memory map for Galactic Anarchy. The first cut: a .prg loaded at $0801 with a BASIC
# line that starts it. The banked layout (two bitmaps, tables, RAM under the ROMs) is added
# as the engine needs it; see the memory map in the design notes.

MEMORY {
    ZP:       file = "", start = $0002, size = $008E, type = rw;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $77FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = MAIN,     type = bss, define = yes;
}
