# ld65 memory map for Galactic Anarchy: a .prg loaded at $0801 with a BASIC line that
# starts it. The frame buffers live in VIC banks 2 and 3 ($8400-$BFFF, $C400-$FF3F) and
# are set up at run time; see src/engine.inc.

MEMORY {
    ZP:       file = "", start = $0002, size = $008E, type = rw;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $77FF;
    # Tables the CPU reads; in VIC bank 2 the VIC sees the character ROM here instead.
    TABLERAM: file = "",  start = $9000, size = $1000, type = rw;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    # Stored in the program, copied to $9000 by the start-up code.
    TABLES:   load = MAIN, run = TABLERAM, type = rw, define = yes;
    BSS:      load = MAIN,     type = bss, define = yes;
}
