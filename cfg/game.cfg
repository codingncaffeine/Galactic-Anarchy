# ld65 memory map for Galactic Anarchy: a .prg loaded at $0801 with a BASIC line that
# starts it. The frame buffers live in VIC banks 2 and 3 ($8400-$BFFF, $C400-$FF3F) and
# are set up at run time; see src/engine.inc.

MEMORY {
    # BASIC and the KERNAL are switched out for good, so all of $02-$FF is ours.
    ZP:       file = "", start = $0002, size = $00FE, type = rw;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $77FF;
    # Variables: over the tables' load image at the start of the program, which is free
    # once the start-up code has copied the tables to $9000. Nothing may use BSS before
    # that (keep_kernal_zp saves to HIBSS2).
    OVERLAY:  file = "",  start = $0810, size = $1000, type = rw;
    # Tables the CPU reads; in VIC bank 2 the VIC sees the character ROM here instead.
    TABLERAM: file = "",  start = $9000, size = $1000, type = rw;
    # Plain RAM after the panel fonts ($8800/$C800, 64 characters each), outside the
    # program; the font area's upper part is never shown since the panel uses codes 0-63.
    HIRAM:    file = "",  start = $8A00, size = $0600, type = rw;
    HIRAM2:   file = "",  start = $CA00, size = $0600, type = rw;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    STARTUP:  load = MAIN,     type = ro;
    # Stored in the program right after the start-up jump, copied to $9000 by the
    # start-up code; BSS then reuses the space.
    TABLES:   load = MAIN, run = TABLERAM, type = rw, define = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = OVERLAY,  type = bss, define = yes;
    HIBSS:    load = HIRAM,    type = bss;
    HIBSS2:   load = HIRAM2,   type = bss;
}
